  /reciters/{id}/surah/{surah}:
    get:
      operationId: getReciterAudio
      tags:
        - reciters
      summary: رابط صوت السورة
      description: |-
        يختار مصحفًا يغطي السورة، مع تفضيل حفص المرتل عند حذف moshaf. يفحص الصوت بطلب HEAD قبل إعادة رابط JSON وبيانات المصحف.

        moshaf هو معرّف مصحف من فهرس القارئ. عدم تغطية السورة يعيد 404؛ فشل مصادر الصوت المتاحة يعيد 503. يقتصر بديل Quran.com على مصاحف حفص المرتلة ذات المطابقة الموثقة.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 123
          description: معرّف القارئ من mp3quran، محفوظ في النسخة المحلية.
        - name: surah
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 114
          example: 1
          description: رقم السورة من 1 إلى 114.
        - name: moshaf
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 7
          description: معرّف مصحف اختياري تابع لهذا القارئ.
      responses:
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReciterAudioResponse"
        "400":
          description: إدخال مفقود أو غير صالح.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
