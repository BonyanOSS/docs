  /prayer/times:
    get:
      operationId: getPrayerTimes
      tags:
        - prayer
      summary: مواقيت الصلاة
      description: |-
        أرسل latitude وlongitude أوcity وcountry. الإحداثيات لها الأولوية عند إرسال الاثنين. طريقة الحساب الافتراضية 4 والمنطقة الزمنية UTC، وتعيد سبعة أوقات بصيغة HH:mm.

        طرق الحساب المدعومة: 1 و2 و3 و4 و5 و9 و10 و11. يتطلب بديل adhan المحلي إحداثيات ويحافظ على التاريخ والطريقة والمنطقة الزمنية. لا يوجد تحويل محلي لأسماء المدن إلى إحداثيات؛ تعذر المصدر يعيد 503. قد يغيب hijri في النتيجة المحلية.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{2}-\d{2}-\d{4}$
          example: 01-01-2026
          description: تاريخ بصيغة DD-MM-YYYY. يجب أن يكون تاريخًا ميلاديًا صحيحًا بسنة لا تقل عن 1000. عند حذفه أو تركه فارغًا يستخدم تاريخ خادم API.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 21.4225
          description: خط العرض بالدرجات العشرية؛ أرسله مع خط الطول.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 39.8262
          description: خط الطول بالدرجات العشرية؛ أرسله مع خط العرض.
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: Mecca
          description: مطلوب مع country عند عدم إرسال الإحداثيات.
        - name: country
          in: query
          required: false
          schema:
            type: string
          example: SA
          description: الدولة للبحث عن المدينة. أرسلها مع city.
        - name: method
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
              - 9
              - 10
              - 11
            default: 4
          example: 4
          description: طريقة الحساب المدعومة. القيمة الافتراضية 4 هي أم القرى.
        - name: timezone
          in: query
          required: false
          schema:
