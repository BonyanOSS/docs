  /hijri/from-gregorian:
    get:
      operationId: fromGregorian
      tags:
        - hijri
      summary: من الميلادي إلى الهجري
      description: يعيد التقويمين وحقل calendar=islamic-umalqura. تُطابق نتيجة Aladhan UAQ مع تحويل Intl المحلي، الذي يُستخدم أيضًا مصدرًا بديلًا.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{2}-\d{2}-\d{4}$
          example: 01-01-2026
          description: تاريخ بصيغة DD-MM-YYYY. يجب أن يكون تاريخًا ميلاديًا صحيحًا بسنة لا تقل عن 1000. عند حذفه أو تركه فارغًا يستخدم تاريخ خادم API.
      responses:
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HijriResponse"
        "400":
          description: إدخال مفقود أو غير صالح.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: تجاوز حد الطلبات. التزم بترويسة Retry-After عند وجودها.
          headers:
            Retry-After:
              description: مدة الانتظار بالثواني إذا أرسلها الخادم.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: خطأ غير متوقع في الخادم.
