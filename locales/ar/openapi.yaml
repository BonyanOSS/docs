          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: الرحمن
          description: جزء من نص عربي مع ترميز URL. الإدخال الفارغ يعيد 400.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          example: 10
          description: حد النتائج وليس ترقيم صفحات. يضبطه الخادم بين 1 و500؛ الصفر أو القيمة غير القابلة للتحليل تعود إلى 50.
