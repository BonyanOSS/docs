  /prayer/times:
    get:
      operationId: getPrayerTimes
      tags:
        - prayer
      summary: مواقيت الصلاة
      description: |-
        أرسل latitude وlongitude أو city وcountry. عند إرسال الزوجين، تُجرّب إحداثيات Aladhan قبل البحث باسم المدينة.

        يتاح بديل pray.zone لطلبات الإحداثيات بتاريخ اليوم على خادم API فقط. لا يستقبل method وقد يحذف method وcoordinates من النتيجة. افحص apiName قبل افتراض ثبات طريقة الحساب. يتحقق هذا المتحكم من كون الإحداثيات أرقامًا دون فرض حدودها الجغرافية؛ يفرض SDK الحدود.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{2}-\d{2}-\d{4}$
          example: 01-01-2026
          description: تاريخ ميلادي بصيغة DD-MM-YYYY. عند حذفه أو تركه فارغًا يستخدم تاريخ خادم API الحالي. التحقق من الصيغة فقط، وليس صحة اليوم في التقويم.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
          example: 21.4225
          description: خط العرض بالدرجات العشرية؛ أرسله مع خط الطول.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
          example: 39.8262
          description: خط الطول بالدرجات العشرية؛ أرسله مع خط العرض.
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: Mecca
          description: مطلوب مع country عند عدم إرسال الإحداثيات.
        - name: country
          in: query
          required: false
          schema:
            type: string
          example: SA
          description: الدولة للبحث عن المدينة. أرسلها مع city.
        - name: method
          in: query
          required: false
          schema:
            type: integer
          example: 4
