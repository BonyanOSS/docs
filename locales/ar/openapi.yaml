        "503":
          description: تعذر الحصول على نتيجة من المصادر المضبوطة.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hijri/to-gregorian:
    get:
      operationId: toGregorian
      tags:
        - hijri
      summary: من الهجري إلى الميلادي
      description: يحوّل تاريخًا هجريًا مطلوبًا بتقويم islamic-umalqura. يتحقق من اليوم 1..30 والشهر 1..12 والسنة 1..2400 قبل طلب المصدر.
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{2}-\d{2}-\d{4}$
          example: 01-09-1447
          description: تاريخ بصيغة DD-MM-YYYY. اليوم الهجري 1..30 والشهر 1..12 والسنة 1..2400.
      responses:
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HijriResponse"
        "400":
          description: إدخال مفقود أو غير صالح.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: تجاوز حد الطلبات. التزم بترويسة Retry-After عند وجودها.
          headers:
            Retry-After:
              description: مدة الانتظار بالثواني إذا أرسلها الخادم.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: خطأ غير متوقع في الخادم.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: تعذر الحصول على نتيجة من المصادر المضبوطة.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /qibla:
    get:
      operationId: getQibla
      tags:
        - qibla
      summary: اتجاه القبلة
      description: |-
        يعيد الزاوية بالدرجات باتجاه عقارب الساعة من الشمال الحقيقي. يجرّب Aladhan ثم يحسب الاتجاه محليًا على الدائرة العظمى.

        هذه زاوية جغرافية وليست قراءة بوصلة الجهاز. الانحراف المغناطيسي واتجاه الجهاز خارج وظيفة هذا المسار.
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 21.4225
          description: خط العرض بالدرجات العشرية؛ أرسله مع خط الطول.
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 39.8262
          description: خط الطول بالدرجات العشرية؛ أرسله مع خط العرض.
      responses:
        "200":
          description: نجاح
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QiblaResponse"
        "400":
          description: إدخال مفقود أو غير صالح.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: تجاوز حد الطلبات. التزم بترويسة Retry-After عند وجودها.
          headers:
            Retry-After:
              description: مدة الانتظار بالثواني إذا أرسلها الخادم.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: خطأ غير متوقع في الخادم.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: تعذر الحصول على نتيجة من المصادر المضبوطة.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Catalogue:
      type: object
      required:
        - name
        - description
        - routes
      properties:
        name:
          type: string
          description: اسم الخدمة.
        description:
          type: string
          description: وصف الخدمة.
        routes:
          type: array
          items:
            type: object
            required:
              - method
              - url
            properties:
              method:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              url:
                type: string
                description: المسار المسجّل؛ تستخدم معاملات المسار صيغة :name.
              schema: {}
    Health:
      type: object
      required:
        - status
        - code
        - timestamp
      properties:
        status:
          type: string
          const: ok
        code:
          type: integer
          const: 200
        timestamp:
          type: string
          description: وقت الخادم الحالي بصيغة ISO 8601.
          format: date-time
    Cache:
      type: object
      required:
        - entries
        - inflight
      properties:
        entries:
          type: integer
          description: عناصر الكاش المخزّنة، بما فيها العناصر التي لم تُزل بعد.
        inflight:
          type: integer
          description: عمليات تحميل الكاش الجارية.
    Ready:
      type: object
      required:
        - status
        - code
        - timestamp
        - cache
      properties:
        status:
          type: string
          const: ready
        code:
          type: integer
          const: 200
        timestamp:
          type: string
          description: وقت الخادم الحالي.
          format: date-time
        cache:
          $ref: "#/components/schemas/Cache"
    Metrics:
      type: string
    Error:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          description: رسالة خطأ مقروءة. لا تعتمد على نصها للتحكم بالبرنامج.
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              description: رمز قابل للمعالجة. قد تستخدم أخطاء 503 المباشرة INTERNAL_SERVER_ERROR؛ ويستخدم فشل المصادر ALL_SOURCES_FAILED.
              enum:
                - BAD_REQUEST
                - NOT_FOUND
                - RATE_LIMITED
                - ALL_SOURCES_FAILED
                - INTERNAL_SERVER_ERROR
            message:
              type: string
              description: رسالة الخطأ.
            requestId:
              type: string
              description: معرّف الطلب لتتبع المشكلة.
    Surah:
      type: object
      required:
        - id
        - name
        - makkia
        - apiName
      properties:
        id:
          type: integer
          description: رقم السورة.
          minimum: 1
          maximum: 114
        name:
          type: string
          description: اسم السورة من المصدر.
        makkia:
          type: boolean
          description: هل السورة مكية.
        apiName:
          type: string
          description: المصدر الذي أعاد هذه النتيجة. قد تختلف الحقول الاختيارية حسب المصدر.
          enum:
            - mp3quran.net
            - alquran.cloud
            - quran.com
            - local
    Aya:
      type: object
      required:
        - number
        - text
        - numberInSurah
      properties:
        number:
          type: integer
          description: رقم الآية العام.
        text:
          type: string
          description: نص المصدر كما يعيده API. لغة التوثيق لا تترجم المحتوى.
        numberInSurah:
          type: integer
          description: رقم الآية داخل سورتها.
