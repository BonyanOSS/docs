          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
          description: First hadith number, inclusive.
        - name: to
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 30
          description: "Last hadith number, inclusive. Use at most 300 items: to = from + 299."
      responses:
