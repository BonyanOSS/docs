  /prayer/times:
    get:
      operationId: getPrayerTimes
      tags:
        - prayer
      summary: Prayer times
      description: |-
        Provide latitude+longitude or city+country. Coordinates take precedence when both are supplied. Uses method 4 and timezone UTC by default and returns seven HH:mm timings.

        Supported methods: 1, 2, 3, 4, 5, 9, 10, 11. The local adhan fallback requires coordinates and preserves the date, method and timezone. City-only requests have no local geocoder; unavailable providers return 503. hijri may be absent in local results.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{2}-\d{2}-\d{4}$
          example: 01-01-2026
          description: Date in DD-MM-YYYY. Must be a real Gregorian date with year at least 1000. Omitted or blank uses the API server date.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
          example: 21.4225
          description: Latitude in decimal degrees; provide it together with longitude.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
          example: 39.8262
          description: Longitude in decimal degrees; provide it together with latitude.
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: Mecca
          description: Required with country when coordinates are not supplied.
        - name: country
          in: query
          required: false
          schema:
            type: string
          example: SA
          description: Country for city lookup. Send together with city.
        - name: method
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
              - 5
              - 9
              - 10
              - 11
            default: 4
          example: 4
          description: Supported calculation method. Default 4 is Umm al-Qura.
        - name: timezone
          in: query
          required: false
          schema:
            type: string
            default: UTC
          example: Asia/Riyadh
          description: IANA timezone for HH:mm output.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerTimesResponse"
        "400":
          description: Invalid or missing input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Request rate exceeded. Respect Retry-After when present.
          headers:
            Retry-After:
              description: Wait duration in seconds, when supplied.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No result could be obtained from configured sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
