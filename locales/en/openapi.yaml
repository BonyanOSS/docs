      description: |-
        Returns book, available and hadiths inside data. Both range endpoints are inclusive; omitted from defaults to 1 and omitted to defaults to from + 29.

        The API currently rejects to - from > 300, so it accepts 301 inclusive items. SDK 1.0.2 rejects more than 300 when both bounds are supplied. Use 300 or fewer for compatibility. An empty range can return 200 with hadiths: [].
