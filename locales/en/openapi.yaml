components:
  schemas:
    Catalogue:
      type: object
      required:
        - name
        - description
        - routes
      properties:
        name:
          type: string
          description: Service name.
        description:
          type: string
          description: Service description.
        routes:
          type: array
          items:
            type: object
            required:
              - method
              - url
            properties:
              method:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              url:
                type: string
                description: Registered route; path parameters use :name syntax.
              schema: {}
    Health:
      type: object
      required:
        - status
        - code
        - timestamp
      properties:
        status:
          type: string
          const: ok
        code:
          type: integer
          const: 200
        timestamp:
          type: string
          description: Current server time in ISO 8601.
          format: date-time
    Cache:
      type: object
      required:
        - entries
        - inflight
      properties:
        entries:
          type: integer
          description: Stored cache entries, including entries not yet evicted.
        inflight:
          type: integer
          description: Cache loads currently in flight.
    Ready:
      type: object
      required:
        - status
        - code
        - timestamp
        - cache
      properties:
        status:
          type: string
          const: ready
        code:
          type: integer
          const: 200
        timestamp:
          type: string
          description: Current server time.
          format: date-time
        cache:
          $ref: "#/components/schemas/Cache"
    Metrics:
      type: string
    Error:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
          description: Human-readable error. Do not parse it for control flow.
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              description: Machine-readable code. Explicit 503 failures can use INTERNAL_SERVER_ERROR; exhausted sources use ALL_SOURCES_FAILED.
              enum:
                - BAD_REQUEST
                - NOT_FOUND
                - RATE_LIMITED
                - ALL_SOURCES_FAILED
                - INTERNAL_SERVER_ERROR
            message:
              type: string
              description: Error message.
            requestId:
              type: string
              description: Request identifier for troubleshooting.
    Surah:
      type: object
      required:
        - id
        - name
        - apiName
      properties:
        id:
          type: integer
          description: Surah number.
          minimum: 1
          maximum: 114
        name:
          type: string
          description: Surah name from the provider.
        makkia:
          type: boolean
          description: Whether the surah is Meccan, when supplied.
        apiName:
          type: string
          description: Provider that supplied this result. Optional fields may vary by provider.
          enum:
            - mp3quran.net
            - alquran.cloud
            - quran.com
    Aya:
      type: object
      required:
        - number
        - text
        - numberInSurah
      properties:
        number:
          type: integer
          description: Global verse number.
        text:
          type: string
          description: Source text as returned by the API. Documentation language does not translate content.
        numberInSurah:
          type: integer
          description: Verse number within its surah.
    SurahWithAyat:
      type: object
      required:
        - number
        - name
        - ayat
        - apiName
      properties:
        number:
          type: integer
          description: Surah number.
        name:
          type: string
          description: Surah name.
        ayat:
          type: array
          items:
            $ref: "#/components/schemas/Aya"
        apiName:
          type: string
          description: Provider that supplied this result. Optional fields may vary by provider.
          enum:
            - alquran.cloud
            - cdn.jsdelivr.net/fawazahmed0/quran-api
    AyaLookup:
      type: object
      required:
        - surahNumber
        - surahName
        - aya
      properties:
        surahNumber:
          type: integer
          description: Surah number.
        surahName:
          type: string
          description: Surah name.
        aya:
          $ref: "#/components/schemas/Aya"
    Moshaf:
      type: object
      required:
        - id
        - name
        - server
      properties:
        id:
          type: integer
          description: Provider moshaf ID.
        name:
          type: string
          description: Moshaf name.
        server:
          type: string
          description: Base audio-server URL.
          format: uri
    Reciter:
      type: object
      required:
        - id
        - name
        - apiName
      properties:
        id:
          type: integer
          description: Provider-specific reciter ID.
        name:
          type: string
          description: Reciter name.
        date:
          type: string
          description: Provider date metadata.
        moshaf:
          type: array
          items:
            $ref: "#/components/schemas/Moshaf"
        style:
          type:
            - string
            - "null"
          description: Recitation style, when provided.
        apiName:
          type: string
          description: Provider that supplied this result. Optional fields may vary by provider.
          enum:
            - mp3quran.net
            - quran.com
    ReciterAudio:
      type: object
      required:
        - reciter
        - surah
        - audio
      properties:
        reciter:
          type: string
          description: Reciter name.
        surah:
          type: integer
          description: Surah number.
        audio:
          type: string
          description: Constructed MP3 URL; file availability is not checked.
          format: uri
    TafsirEdition:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: Public edition key accepted in paths.
          enum:
            - muyassar
            - jalalayn
            - saadi
            - waseet
            - qurtubi
        label:
          type: string
          description: Arabic edition name.
    TafsirItem:
      type: object
      required:
        - surah
        - aya
        - text
        - edition
        - apiName
      properties:
        surah:
          type: integer
          description: Surah number.
        aya:
          type: integer
          description: Verse number within the surah.
        text:
          type: string
          description: Source text as returned by the API. Documentation language does not translate content.
        edition:
          type: string
          description: Provider edition ID, for example ar.muyassar or arabic_moyassar. This differs from the public path ID.
        apiName:
