      operationId: searchAyat
      tags:
        - ayat
      summary: Search Quran text
      description: |-
        Returns {success, total, data: [...]}. total counts returned matches after the limit, not all matches in the Quran.

        SDK 1.0.2 has an envelope mismatch in client.ayat.search(). Use the fetch example here or the compatibility helper in the SDK guide.
      parameters:
        - name: text
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: الرحمن
          description: Arabic substring, URL-encoded. Blank input returns 400.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
          example: 10
          description: Result cap, not pagination. The server clamps to 1..500; zero or an unparsable value falls back to 50.
