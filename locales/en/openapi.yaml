      tags:
        - hadith
      summary: Hadith range
      description: |-
        Returns book, available and hadiths inside data. Inclusive range defaults to from=1 and to=from+29; at most 300 requested numbers are accepted.

        Numbering may contain gaps. A range can return fewer narrations or an empty array. available is the count of stored narrations, so it is not a bound for lookup numbers. Unknown books return 404.
      parameters:
        - name: book
          in: path
          required: true
          schema:
