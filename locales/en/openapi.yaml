  /reciters/{id}/surah/{surah}:
    get:
      operationId: getReciterAudio
      tags:
        - reciters
      summary: Surah audio URL
      description: |-
        Selects a recording covering the surah, preferring Hafs murattal when moshaf is omitted. Verifies the audio with HEAD before returning a JSON URL and recording metadata.

        moshaf is a recording ID from the reciter catalogue. Missing recording coverage returns 404; failure of all eligible audio providers returns 503. Quran.com fallback is restricted to verified matching Hafs murattal recordings.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 123
          description: Stable mp3quran reciter ID, preserved in the local snapshot.
        - name: surah
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 114
          example: 1
          description: Surah number, 1 through 114.
        - name: moshaf
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          example: 7
          description: Optional recording ID owned by this reciter.
      responses:
