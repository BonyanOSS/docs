  /prayer/times:
    get:
      operationId: getPrayerTimes
      tags:
        - prayer
      summary: Prayer times
      description: |-
        Provide latitude + longitude or city + country. With both pairs, Aladhan coordinates are tried before Aladhan city lookup.

        pray.zone fallback is available only for coordinate requests dated today on the API server. It does not receive method, and may omit method and coordinates. Inspect apiName before assuming identical calculation settings. This controller validates numeric coordinates but does not enforce geographic bounds; SDK validation does.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{2}-\d{2}-\d{4}$
          example: 01-01-2026
          description: Gregorian date in DD-MM-YYYY. Omitted or blank uses the API server’s current date. Validation checks the format, not calendar validity.
        - name: latitude
          in: query
          required: false
          schema:
            type: number
          example: 21.4225
          description: Latitude in decimal degrees; provide it together with longitude.
        - name: longitude
          in: query
          required: false
          schema:
            type: number
          example: 39.8262
          description: Longitude in decimal degrees; provide it together with latitude.
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: Mecca
          description: Required with country when coordinates are not supplied.
        - name: country
          in: query
          required: false
          schema:
            type: string
          example: SA
          description: Country for city lookup. Send together with city.
        - name: method
          in: query
          required: false
          schema:
            type: integer
          example: 4
          description: Aladhan calculation method ID. Omitted uses the provider default.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerTimesResponse"
        "400":
          description: Invalid or missing input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Request rate exceeded. Respect Retry-After when present.
          headers:
